# Builds the release artifacts and publishes the Flatpak bundle to a GitHub
# Release. The MSIX for the Microsoft Store is built alongside.
#
# Triggers on version tags (v1.0.0, v1.2.3, ...): push the tag and the release
# appears with the bundle attached. A manual run (workflow_dispatch) builds the
# same artifacts and attaches them to the run for inspection without creating
# a release.
#
# `version` refuses a tag that doesn't match package.json, and any version
# without a <release> entry in the Flatpak metainfo: AppStream lists each
# release with its date, and software centers show them.
#
# The Windows build uses the runner's preinstalled MSVC Rust and Visual
# Studio, as ci.yml does. On MSVC the WebView2 loader is linked into the exe,
# so no DLL ships beside it.
#
# `test-linux` runs the tests on the same setup as ci.yml. `build-flatpak` is
# flatpak.yml, which builds the bundle in Flathub's CI image and lints it.
#
# After publishing, `publish` starts publish.yml in terminalis/packages, which
# adds the new bundle to the signed Flatpak repository that Flatpak installs
# update from.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # package.json is the one place the app version lives; Tauri reads it
  # through tauri.conf.json's "version": "../package.json".
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the app version from package.json
        id: read
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Fail if tag does not match the app version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version v$VERSION" >&2
            exit 1
          fi

      - name: Fail if the Flatpak metainfo has no entry for this version
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if ! grep -qF "<release version=\"$VERSION\"" flatpak/io.github.terminalis.Gittin.metainfo.xml; then
            echo "flatpak/io.github.terminalis.Gittin.metainfo.xml has no <release version=\"$VERSION\"> entry" >&2
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    needs: version
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the desktop page, then the exe (no installer: tauri.windows.conf.json turns bundling off).
      - name: Build the exe
        run: npm run tauri build

      - name: Run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Package MSIX for the Microsoft Store
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./tools/package-msix.ps1 -Version $env:VERSION

      # Not zipped: the artifact is the .msix itself, named after the file.
      - name: Attach MSIX to the run
        uses: actions/upload-artifact@v7
        with:
          path: out/Gittin_*.msix
          archive: false

  test-linux:
    runs-on: ubuntu-22.04
    needs: version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          # The Tauri v2 Linux prerequisites: WebKitGTK for the webview, the
          # toolchain for native deps.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev librsvg2-dev libssl-dev xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tauri builds the desktop page into the app, so it must exist before cargo runs.
      - run: npm run build:desktop

      - name: Run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  build-flatpak:
    needs: version
    uses: ./.github/workflows/flatpak.yml

  publish:
    runs-on: ubuntu-latest
    needs: [version, build-windows, test-linux, build-flatpak]
    permissions:
      contents: write
    if: github.ref_type == 'tag'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # An upload keeps only the folders after its path's first wildcard, so
      # the bundle sits at the top of dist/.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*_x86_64.flatpak \
            --verify-tag --generate-notes --title "Gittin $VERSION"

      # The Flatpak repository (terminalis/packages) imports each release's
      # bundle. GITHUB_TOKEN can't start workflows in another repo, so this
      # uses a separate token.
      - name: Add the bundle to the Flatpak repository
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
        run: gh workflow run publish.yml --repo terminalis/packages --ref main
