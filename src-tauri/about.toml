# Licences accepted in the desktop app's Rust libraries; `cargo about generate` names any others.
# No `targets`: the notices name every library built into the app on any platform. Regenerate them when
# Cargo.lock changes:
#   cargo about generate --manifest-path src-tauri/Cargo.toml -c src-tauri/about.toml src-tauri/about.hbs -o src-tauri/THIRD_PARTY_NOTICES.txt
# Gittin's own crate (publish = false) isn't a third-party library.
private = { ignore = true }
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "BSL-1.0", "CC0-1.0", "0BSD"]
