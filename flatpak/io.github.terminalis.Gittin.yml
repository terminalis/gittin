id: io.github.terminalis.Gittin
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: gittin
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Images in documents can come from the web, as in a browser, and signing in to GitHub, Clone, Sync and
  # Publish need it. Files come only through the portals.
  - --share=network
  # git's settings name the author of commits Gittin makes in repositories; read only. The XDG location
  # (~/.config/git/config) isn't read: in the sandbox XDG_CONFIG_HOME is the app's own folder, so where
  # git's settings live only there, saving asks once for a name and email.
  - --filesystem=~/.gitconfig:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
modules:
  - name: gittin
    buildsystem: simple
    build-options:
      env:
        # cargo-sources.json unpacks the crates and a config that points
        # cargo at them under cargo/ in this module's build folder.
        CARGO_HOME: /run/build/gittin/cargo
        # node-sources.json fills npm's cache under flatpak-node/, for an offline npm ci.
        npm_config_cache: /run/build/gittin/flatpak-node/npm-cache
        npm_config_offline: 'true'
        XDG_CACHE_HOME: /run/build/gittin/flatpak-node/cache
    build-commands:
      - npm ci --ignore-scripts
      - npm run build:desktop
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - cargo --offline build --release --locked --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/gittin /app/bin/gittin
      - install -Dm644 flatpak/io.github.terminalis.Gittin.desktop /app/share/applications/io.github.terminalis.Gittin.desktop
      - install -Dm644 flatpak/io.github.terminalis.Gittin.metainfo.xml /app/share/metainfo/io.github.terminalis.Gittin.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.terminalis.Gittin.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.terminalis.Gittin.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.terminalis.Gittin.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.terminalis.Gittin.png
    sources:
      # This checkout.
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - builddir
          - repo
          - node_modules
          - src-tauri/target
          - .worktrees
          - dist
          - dist-desktop
          - test-results
      # Generated by tools/flatpak-cargo-sources.sh from src-tauri/Cargo.lock.
      - cargo-sources.json
      # Generated by tools/flatpak-node-sources.sh from package-lock.json.
      - node-sources.json
